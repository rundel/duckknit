# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/latest/download/duckdb-cli-osx-universal.tar.gz
          sudo tar -xzf duckdb.tar.gz -C /usr/local/bin
          rm duckdb.tar.gz
          duckdb --version

      - name: Install DuckDB CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/latest/download/duckdb-cli-linux-amd64.tar.gz
          sudo tar -xzf duckdb.tar.gz -C /usr/local/bin
          rm duckdb.tar.gz
          duckdb --version

      - name: Install DuckDB CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/latest/download/duckdb-cli-windows-amd64.tar.gz
          New-Item -ItemType Directory -Force -Path "$HOME/bin" | Out-Null
          tar -xzf duckdb.tar.gz -C "$HOME/bin"
          Remove-Item duckdb.tar.gz
          echo "$HOME/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$HOME/bin/duckdb.exe" --version
        shell: pwsh

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
