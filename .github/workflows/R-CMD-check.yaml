# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, duckdb ${{ matrix.config.duckdb }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', duckdb: 'v2.0.0'}
          - {os: windows-latest, r: 'release', duckdb: 'v2.0.0'}
          - {os: ubuntu-latest,  r: 'devel',   duckdb: 'v2.0.0', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', duckdb: 'v2.0.0'}
          - {os: ubuntu-latest,  r: 'oldrel-1', duckdb: 'v2.0.0'}
          - {os: macos-latest,   r: 'release', duckdb: 'v1.5.6'}
          - {os: windows-latest, r: 'release', duckdb: 'v1.5.6'}
          - {os: ubuntu-latest,  r: 'release', duckdb: 'v1.5.6'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      # DuckDB renamed its CLI release assets in v2.0.0 (duckdb_cli-*.zip
      # became duckdb-cli-*.tar.gz), so the download differs by major version.
      - name: Install DuckDB CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ matrix.config.duckdb }}"
          case "$RUNNER_OS" in
            Linux) PLATFORM=linux-amd64 ;;
            macOS) PLATFORM=osx-universal ;;
          esac
          BASE="https://github.com/duckdb/duckdb/releases/download/$VERSION"
          if [[ "$VERSION" == v1.* ]]; then
            curl -fsSL -o duckdb.zip "$BASE/duckdb_cli-$PLATFORM.zip"
            sudo unzip -o duckdb.zip duckdb -d /usr/local/bin
            rm duckdb.zip
          else
            curl -fsSL -o duckdb.tar.gz "$BASE/duckdb-cli-$PLATFORM.tar.gz"
            sudo tar -xzf duckdb.tar.gz -C /usr/local/bin duckdb
            rm duckdb.tar.gz
          fi
          duckdb --version

      - name: Install DuckDB CLI (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ matrix.config.duckdb }}"
          $base = "https://github.com/duckdb/duckdb/releases/download/$version"
          New-Item -ItemType Directory -Force -Path "$HOME/bin" | Out-Null
          if ($version -like "v1.*") {
            curl -fsSL -o duckdb.zip "$base/duckdb_cli-windows-amd64.zip"
            Expand-Archive duckdb.zip -DestinationPath "$HOME/bin" -Force
            Remove-Item duckdb.zip
          } else {
            curl -fsSL -o duckdb.tar.gz "$base/duckdb-cli-windows-amd64.tar.gz"
            tar -xzf duckdb.tar.gz -C "$HOME/bin"
            Remove-Item duckdb.tar.gz
          }
          echo "$HOME/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$HOME/bin/duckdb.exe" --version
        shell: pwsh

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
